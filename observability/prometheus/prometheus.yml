global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: labdesk-api
    metrics_path: /metrics
    static_configs:
      - targets: [api:8080]
        labels:
          service: labdesk-api
          environment: local

  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: [rabbitmq:15692]
        labels:
          service: labdesk-rabbitmq
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: [prometheus:9090]

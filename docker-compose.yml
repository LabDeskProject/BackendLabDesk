

services:
  labdesk.api:
    image: ${DOCKER_REGISTRY-}labdeskapi
    build:
      context: .
      dockerfile: src/LabDesk.Api/Dockerfile
    ports:
      - "5000:8080"
      - "5001:8081"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=labdesk.database;Database=LabDeskDb;User Id=sa;Password=YourStrong@Password123;TrustServerCertificate=True;
    depends_on:
      labdesk.database:
        condition: service_healthy

  labdesk.database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: labdesk.database
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password123
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - mssqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'YourStrong@Password123' -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mssqldata: